<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Smooth Glow Filter -->
    <filter id="glow-sq" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow-sq" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="fb-sq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="ff-sq" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="rust-sq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <linearGradient id="cyan-sq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <linearGradient id="purple-sq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <linearGradient id="green-sq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="text-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Centered and scaled graphic mark container -->
  <g transform="translate(-19.57, -11.64) scale(1.22)">
    <!-- Ground Shadow (Maintained for depth) -->
    <ellipse cx="68" cy="104" rx="44" ry="5" fill="#000000" opacity="0.65" filter="blur(4px)"/>

    <!-- Folder Backplate -->
    <path d="M25 29 C25 26.2 27.2 24 30 24 H58 L68 34 H107 C109.8 34 112 36.2 112 39 V95 C112 97.8 109.8 100 107 100 H30 C27.2 100 25 97.8 25 95 Z" 
          fill="url(#fb-sq)" 
          stroke="#384356" 
          stroke-width="1.2"/>

    <!-- Stacked Code Document Pages -->
    <g id="document-stack" filter="url(#shadow-sq)">
      <!-- Back Page (Rotated slightly left) -->
      <rect x="36" y="30" width="62" height="62" rx="3" fill="#0F172A" stroke="#1E293B" stroke-width="0.8" transform="rotate(-4 67 61)" opacity="0.6"/>
      
      <!-- Middle Page (Rotated slightly right) -->
      <rect x="38" y="31" width="62" height="62" rx="3" fill="#0F172A" stroke="#1E293B" stroke-width="0.8" transform="rotate(3 69 62)" opacity="0.8"/>
      
      <!-- Front Page -->
      <rect x="34" y="33" width="66" height="62" rx="3.5" fill="#161D2B" stroke="#334155" stroke-width="0.8"/>
      
      <!-- Background Text/Code Lines -->
      <rect x="40" y="40" width="48" height="3" rx="1.5" fill="#475569" opacity="0.4"/>
      <rect x="40" y="48" width="54" height="3" rx="1.5" fill="#475569" opacity="0.4"/>
      <rect x="40" y="56" width="50" height="3" rx="1.5" fill="#475569" opacity="0.4"/>
      <rect x="40" y="64" width="52" height="3" rx="1.5" fill="#475569" opacity="0.4"/>
      <rect x="40" y="72" width="46" height="3" rx="1.5" fill="#475569" opacity="0.4"/>
      <rect x="40" y="80" width="46" height="3" rx="1.5" fill="#475569" opacity="0.4"/>
      <rect x="40" y="88" width="40" height="3" rx="1.5" fill="#475569" opacity="0.4"/>

      <!-- Spread Search Match Highlights -->
      <rect x="42" y="48" width="16" height="3" rx="1.5" fill="url(#purple-sq)"/>
      <rect x="42" y="56" width="18" height="3" rx="1.5" fill="url(#green-sq)"/>
      <rect x="60" y="72" width="16" height="3" rx="1.5" fill="url(#cyan-sq)"/>
      <rect x="40" y="80" width="14" height="3" rx="1.5" fill="url(#rust-sq)"/>
    </g>

    <!-- Contoured Front Folder Cover Flap -->
    <path d="M25 54 C25 51.5 27 49.5 29.5 49.5 H55 L65 57.5 H107.5 C110 57.5 112 59.5 112 62 V95 C112 97.8 109.8 100 107 100 H30 C27.2 100 25 97.8 25 95 Z" 
          fill="url(#ff-sq)" 
          stroke="#4B5563" 
          stroke-width="1"
          opacity="0.9"/>
    
    <!-- Cover Highlight Lip -->
    <path d="M26.5 50 L54 50 L64 58 L111 58" stroke="#9CA3AF" stroke-width="0.8" opacity="0.3" fill="none"/>

    <!-- Focused Search Highlight Match -->
    <g id="lens-match">
      <rect x="64" y="61.5" width="24" height="5" rx="2.5" fill="url(#text-accent)" filter="url(#glow-sq)"/>
    </g>

    <!-- Bold Magnifying Glass Lens & Handle -->
    <g id="search-lens" filter="url(#shadow-sq)">
      <line x1="87" y1="75" x2="100" y2="88" stroke="url(#cyan-sq)" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="87" y1="75" x2="100" y2="88" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
      <circle cx="76" cy="64" r="16" fill="none" stroke="url(#cyan-sq)" stroke-width="2.5" filter="url(#glow-sq)"/>
      <circle cx="76" cy="64" r="16" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.8"/>
      <circle cx="76" cy="64" r="15" fill="#06B6D4" fill-opacity="0.1"/>
    </g>
  </g>
</svg>